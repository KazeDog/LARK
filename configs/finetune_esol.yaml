# Example molecular property regression; all encoder parameters are fine-tuned.
dataset: esol
task_type: regression
selection_metric: validation_rmse
run_name: esol
data:
  data_root: ${DATA_ROOT}/esol
  train_csv: ${DATA_ROOT}/esol/train.csv
  valid_csv: ${DATA_ROOT}/esol/valid.csv
  test_csv: ${DATA_ROOT}/esol/test.csv
  molecule_store: ${DATA_ROOT}/esol/molecule_store.mdb
  manifest: ${DATA_ROOT}/esol/manifest.json
save_dir: ${RESULTS_ROOT}/finetune
pretrain_path: ${RESULTS_ROOT}/pretrain/lark/best.pt
variant: pretrained_finetune
gpu: 0
seed: 42
deterministic: false
epochs: 100
early_stop_patience: 20
early_stop_min_delta: 1.0e-4
batch_size: 32
num_workers: 0
lr: 1.0e-4
weight_decay: 1.0e-5
gradient_clip_norm: 1.0
model:
  mol_embed_dim: 256
  mol_num_kernel: 256
  mol_num_heads: 16
  mol_num_layers: 6
  mol_hidden_size: 256
  head_hidden_dim: 256
  dropout: 0.1
